# ===================================================================
#  tarot.zaopic.cn  —  Nginx 站点配置（方式B：前端 Nginx 托管 + /api 反代后端）
#  放置：/etc/nginx/conf.d/tarot.zaopic.cn.conf   （或 sites-available 后软链 sites-enabled）
#  生效：sudo nginx -t && sudo nginx -s reload
#
#  ⚠️ 先用 certbot 签好证书再 reload，否则因找不到 .pem 文件启动失败：
#     sudo certbot certonly --nginx -d tarot.zaopic.cn
#  （或先只保留下面 80 的 server 跑通，再执行 `certbot --nginx -d tarot.zaopic.cn` 让它自动补全 443）
# ===================================================================

# HTTP：ACME 验证 + 强制跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tarot.zaopic.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;          # certbot --webroot 用；用 --nginx 模式可忽略
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tarot.zaopic.cn;

    # —— TLS 证书（certbot 申请后的默认路径）——
    ssl_certificate     /etc/letsencrypt/live/tarot.zaopic.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tarot.zaopic.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # —— 前端构建产物所在目录（把 tarot-vue/dist 传到这里）——
    root /var/www/tarot.zaopic.cn/dist;   # ← 改成你实际存放 dist 的路径
    index index.html;

    # 头像上传走 multer，放宽请求体上限
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # —— API → 后端 Express (5174)。注意 proxy_pass 不带尾斜杠，保留 /api 前缀 ——
    location /api/ {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # 配合后端 trust proxy
        proxy_read_timeout 60s;                       # DeepSeek 解读可能较慢
    }

    # —— 用户上传资源（头像等）由后端 /uploads 提供 ——
    location /uploads/ {
        proxy_pass http://127.0.0.1:5174;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # —— 健康检查：精确匹配反代到后端（外部监控 & 部署自检用）——
    location = /health {
        proxy_pass http://127.0.0.1:5174;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # —— 带 hash 的构建产物：长缓存；缺失就真 404，绝不 fallback 成 HTML ——
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # —— SPA fallback：/reset-password 等深链接统一回 index.html（history 模式必需）——
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，确保每次拿到最新 chunk 引用
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

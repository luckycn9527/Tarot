<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-labelledby="title desc">
  <title id="title">Scythe oracle card</title>
  <desc id="desc">Original decorative card artwork for the Scythe Lenormand reference card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#21153a"/><stop offset=".56" stop-color="#111020"/><stop offset="1" stop-color="#0a0912"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="24%" r="70%"><stop stop-color="hsl(264 55% 45% / .38)"/><stop offset="1" stop-color="#090812" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="600" height="800" rx="28" fill="url(#bg)"/>
  <rect width="600" height="800" rx="28" fill="url(#glow)"/>
  <circle cx="110" cy="120" r="80" fill="hsl(264 55% 45% / .38)" filter="url(#blur)" opacity=".75"/>
  <circle cx="500" cy="700" r="110" fill="#8b5cf6" opacity=".08" filter="url(#blur)"/>
  <rect x="28" y="28" width="544" height="744" rx="20" fill="none" stroke="hsl(264 64% 72%)" stroke-opacity=".52" stroke-width="2"/>
  <path d="M90 220h420M90 580h420" stroke="hsl(264 64% 72%)" stroke-opacity=".18"/>
  <text x="68" y="88" fill="#f5efe7" fill-opacity=".78" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">10</text>
  <text x="300" y="430" text-anchor="middle" fill="hsl(264 64% 72%)" fill-opacity=".92" font-family="Georgia, serif" font-size="190">⌁</text>
  <text x="300" y="690" text-anchor="middle" fill="#f5efe7" fill-opacity=".84" font-family="Georgia, serif" font-size="28" letter-spacing="3">SCYTHE</text>
  <text x="300" y="730" text-anchor="middle" fill="hsl(264 64% 72%)" fill-opacity=".68" font-family="Arial, sans-serif" font-size="13" letter-spacing="5">LENORMAND ORACLE</text>
</svg>
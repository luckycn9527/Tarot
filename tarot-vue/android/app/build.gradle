apply plugin: 'com.android.application'

def mobileVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../mobile-version.json'))

android {
    namespace = "cn.zaopic.etomd"
    buildFeatures {
        buildConfig = true
    }
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "cn.zaopic.etomd"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode mobileVersion.versionCode.toInteger()
        versionName mobileVersion.version.toString()
        buildConfigField "boolean", "UPDATER_QA", "false"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions "region"
    productFlavors {
        domestic {
            dimension "region"
            resValue "string", "app_name", "E-Tomd"
        }
        overseas {
            dimension "region"
            applicationIdSuffix ".global"
            resValue "string", "app_name", "E-Tomd Global"
            resValue "string", "title_activity_main", "E-Tomd Global"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        updaterQa {
            initWith debug
            matchingFallbacks = ['debug']
            buildConfigField "boolean", "UPDATER_QA", "true"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// A flavor must never silently package another region's account/API assets.
// Build each region through scripts/mobile-android.mjs, which rebuilds the web
// assets before invoking its matching variant.
android.applicationVariants.all { variant ->
    variant.preBuildProvider.configure {
        doFirst {
            def metadata = file('src/main/assets/public/mobile-release.json')
            if (!metadata.exists()) throw new GradleException('Build and sync mobile web assets first')
            def release = new groovy.json.JsonSlurper().parse(metadata)
            def expectedOrigin = variant.flavorName == 'domestic' ? 'https://121.40.27.226:9443' : 'https://asktarot.zaopic.cn'
            if (release.site != variant.flavorName || release.apiOrigin != expectedOrigin || !release.bundled) {
                throw new GradleException('Mobile web asset region does not match the Android flavor')
            }
            if (release.version != mobileVersion.version || release.versionCode != mobileVersion.versionCode) {
                throw new GradleException('Mobile web asset version does not match the Android version')
            }
        }
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

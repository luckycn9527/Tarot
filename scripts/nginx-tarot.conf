# ============================================================
# Nginx 反向代理配置 · tarot.zaopic.cn → 127.0.0.1:5174
# ------------------------------------------------------------
# 用法：
#   1) 复制到服务器： /etc/nginx/conf.d/tarot.conf
#      （Ubuntu/Debian 也可放 /etc/nginx/sites-available/ 并软链到 sites-enabled/）
#   2) nginx -t 测试配置
#   3) systemctl reload nginx
#   4) 再用 certbot 自动改写本文件、签发 HTTPS 证书（见下方说明）
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name tarot.zaopic.cn;

    # 上传大小：头像 / 卡背等（按需调整）
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 支持 WebSocket / SSE（如有）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
    }
}

# 说明：
# 运行 `certbot --nginx -d tarot.zaopic.cn` 后，certbot 会自动：
#   - 在本 server 块加入 443 监听 + ssl_certificate 等指令
#   - 把 80 端口改为 301 跳转到 https
# 因此 HTTPS 部分无需手写，交给 certbot 即可。
